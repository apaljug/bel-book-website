<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPERFRIED</title>
<style>
  :root {
    --green: #33ff66;
    --dim: #1a8033;
    --bg: #000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: "VT323", "Courier New", Courier, monospace;
    font-size: 18px;
    line-height: 1.5;
    text-shadow: 0 0 4px rgba(51, 255, 102, 0.6);
  }

  /* CRT scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.35) 3px
    );
    z-index: 10;
  }

  a { color: var(--green); }
  a:hover { background: var(--green); color: var(--bg); text-shadow: none; }

  section {
    max-width: 720px;
    margin: 0 auto;
    padding: 4rem 1.5rem;
  }

  /* ---------- top screen ---------- */
  #home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }


  h1 {
    font-size: clamp(2.5rem, 10vw, 5rem);
    font-weight: normal;
    letter-spacing: 0.1em;
  }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1em;
    background: var(--green);
    vertical-align: -0.1em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .tagline { color: var(--dim); margin: 0.5rem 0 2rem; }

  .ig { font-size: 1.4rem; }

  .scroll-hint {
    margin-top: 4rem;
    color: var(--dim);
    text-decoration: none;
  }

  /* ---------- events ---------- */
  h2 {
    font-weight: normal;
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .events { list-style: none; }

  .events li {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 1rem;
    padding: 0.75rem 0;
    border-bottom: 1px dashed var(--dim);
  }

  .events .date { color: var(--dim); }
  .events .title { text-transform: uppercase; }
  .events .info { color: var(--dim); display: block; }

  /* ---------- mailing list ---------- */
  form { display: flex; flex-wrap: wrap; gap: 0.75rem; }

  input[type="email"] {
    flex: 1 1 240px;
    background: var(--bg);
    color: var(--green);
    border: 1px solid var(--green);
    padding: 0.6rem 0.8rem;
    font: inherit;
    outline: none;
  }
  input[type="email"]::placeholder { color: var(--dim); }
  input[type="email"]:focus { box-shadow: 0 0 8px var(--green); }

  button {
    background: var(--green);
    color: var(--bg);
    border: none;
    padding: 0.6rem 1.2rem;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--bg); color: var(--green); outline: 1px solid var(--green); }

  .status { margin-top: 1rem; min-height: 1.5em; }

  footer {
    text-align: center;
    color: var(--dim);
    padding: 3rem 1rem;
  }
  /* ---------- laser intro ---------- */
  #lasers {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 9; /* just under the scanlines */
    cursor: pointer;
    transition: opacity 0.8s ease;
  }
  #lasers.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

  <!-- Laser intro (click or press any key to skip) -->
  <canvas id="lasers"></canvas>

  <!-- ===== TOP SCREEN ===== -->
  <section id="home">
    <h1>HYPERFRIED<span class="cursor"></span></h1>
    <p class="tagline">experimental theater &amp; performance space</p>

    <!-- EDIT: put your Instagram handle here -->
    <a class="ig" href="https://instagram.com/YOUR_HANDLE" target="_blank" rel="noopener">Instagram</a>

    <a class="scroll-hint" href="#events">upcoming events &darr;</a>
  </section>

  <!-- ===== EVENTS ===== -->
  <section id="events">
    <h2>Upcoming Events</h2>

    <!-- EDIT: one <li> per event. Copy/paste to add more. -->
    <ul class="events">
      <li>
        <span class="date">NOV 01 SUN</span>
        <span><span class="title">Hyperfried Halloween</span></span>
      </li>
      <li>
        <span class="date">NOV 05 THU</span>
        <span><span class="title">(Secret) Movie Night</span></span>
      </li>
      <li>
        <span class="date">NOV 12 THU</span>
        <span><span class="title">Vinyl Jam</span></span>
      </li>
      <li>
        <span class="date">NOV 19 THU</span>
        <span><span class="title">Open Improv Jam</span></span>
      </li>
      <li>
        <span class="date">NOV 21 SAT</span>
        <span><span class="title">Jest Friends</span></span>
      </li>
    </ul>
  </section>

  <!-- ===== MAILING LIST ===== -->
  <section id="mailing-list">
    <h2>Join the Mailing List</h2>

    <!-- EDIT: set action="" to your signup service URL (see notes) -->
    <form id="signup" action="" method="POST">
      <input type="email" name="email" placeholder="your email" required>
      <button type="submit">Sign Up</button>
    </form>
    <p class="status" id="status"></p>
  </section>

  <footer>
    &copy; <span id="year"></span> HYPERFRIED
  </footer>

<script>
  // ---------- laser intro ----------
  (function () {
    const canvas = document.getElementById("lasers");
    const ctx = canvas.getContext("2d");
    const DURATION = 2500; // ms
    let w, h, start, finished = false;

    function finish() {
      if (finished) return;
      finished = true;
      canvas.classList.add("done");
      setTimeout(() => canvas.remove(), 900);
    }

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      canvas.remove();
      return;
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);
    canvas.addEventListener("click", finish);
    window.addEventListener("keydown", finish, { once: true });

    // Three projectors along the top edge, like stage lasers
    const projectors = [
      { x: 0.1, beams: 6, speed: 1.3, phase: 0 },
      { x: 0.5, beams: 8, speed: -0.9, phase: 2 },
      { x: 0.9, beams: 6, speed: 1.1, phase: 4 }
    ];

    function frame(now) {
      if (finished) return;
      if (!start) start = now;
      const t = (now - start) / 1000;
      const p = (now - start) / DURATION;

      // fade in, hold, fade out
      const level = Math.min(1, p / 0.12) * Math.min(1, (1 - p) / 0.2);

      // leave light trails by fading the previous frame toward transparent
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
      ctx.fillRect(0, 0, w, h);

      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      ctx.shadowColor = "#33ff66";
      const len = Math.hypot(w, h);

      projectors.forEach((pr) => {
        const ox = pr.x * w, oy = -4;
        for (let i = 0; i < pr.beams; i++) {
          const spread = (i / (pr.beams - 1) - 0.5) * 1.6;
          const sweep = Math.sin(t * pr.speed + pr.phase + i * 0.35) * 0.6;
          const angle = Math.PI / 2 + spread + sweep;
          const flicker = 0.75 + Math.random() * 0.25;
          const a = level * flicker;

          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.lineTo(ox + Math.cos(angle) * len, oy + Math.sin(angle) * len);

          // wide soft glow, then a bright core
          ctx.shadowBlur = 20;
          ctx.strokeStyle = `rgba(51, 255, 102, ${0.25 * a})`;
          ctx.lineWidth = 6;
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = `rgba(200, 255, 210, ${0.8 * a})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        // glowing projector head
        const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, 60);
        g.addColorStop(0, `rgba(180, 255, 200, ${0.9 * level})`);
        g.addColorStop(1, "rgba(51, 255, 102, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(ox - 60, oy - 60, 120, 120);
      });

      if (p >= 1) finish();
      else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  document.getElementById("year").textContent = new Date().getFullYear();

  const form = document.getElementById("signup");
  const status = document.getElementById("status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "sending...";

    // No signup service configured yet — just show a confirmation
    if (!form.action || form.getAttribute("action") === "") {
      status.textContent = "thanks! (demo mode — no signup service connected yet)";
      form.reset();
      return;
    }

    try {
      const res = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "Accept": "application/json" }
      });
      status.textContent = res.ok
        ? "thanks! you are on the list."
        : "something went wrong, please try again.";
      if (res.ok) form.reset();
    } catch {
      status.textContent = "something went wrong, please try again.";
    }
  });
</script>
</body>
</html>
