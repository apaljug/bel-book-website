<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Primate Evolution: Evan Edition</title>
<!-- Plain-HTML port of ape-unit/PrimateEvolution (originally a React app) -->
<style>
  body {
    margin: 0;
    font-family: "Comic Sans MS", cursive, sans-serif;
    background: #ffffcc url("img/banana.png") repeat;
    background-size: 60px;
  }
  .back { position: absolute; top: 8px; left: 10px; font-size: 14px; background: #fff; padding: 2px 6px; border: 2px outset #ccc; color: blue; }

  /* top bar */
  .top-bg { height: 150px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.85); border-bottom: 4px ridge #e8d33f; }
  .banana-icon { height: 100px; width: 100px; animation: banana-logo-spin alternate infinite 0.75s ease; }
  .banana-count-text { font-size: 54px; padding-left: 15px; margin: 0; }
  @keyframes banana-logo-spin { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }

  .central-div { width: 90%; max-width: 900px; margin: 20px auto; background: #fff; border: 4px ridge #e8d33f; padding: 20px; text-align: center; }

  /* the big clickable Evan */
  #evan { width: 220px; cursor: pointer; transition: transform 0.05s; user-select: none; -webkit-user-drag: none; }
  #evan:active { transform: scale(0.92) rotate(-4deg); }
  .pop { position: fixed; pointer-events: none; font-weight: bold; color: #b8860b; font-size: 22px; animation: pop 0.8s ease-out forwards; }
  @keyframes pop { to { transform: translateY(-60px); opacity: 0; } }

  button.plain { font-family: inherit; font-size: 16px; padding: 6px 12px; margin: 6px; border: 3px outset #e8d33f; background: #fff7b0; cursor: pointer; }
  button.plain:active { border-style: inset; }

  /* producers */
  .producer-main-div { width: 500px; max-width: 100%; height: 150px; display: flex; margin: 0 auto; }
  .producer-left-side { width: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .producer-right-side { width: 350px; display: flex; flex-direction: column; justify-content: center; }
  .producer-icon { width: 100px; height: 100px; border-radius: 55px; border: 2px solid; object-fit: cover; }
  .producer-count-div { width: 90px; margin-top: -14px; border-radius: 25px; background: #e8d33f; border: 0.5px solid; font-size: 13px; font-weight: bold; }
  .producer-name-text { font-size: 18px; margin: 0; }
  .producer-purchase-div { display: flex; align-items: center; justify-content: center; height: 40px; }
  .producer-price-text { font-size: 28px; width: 150px; margin: 0 0 0 10px; }
  .upgrade { border: none; background-color: white; background-size: contain; background-repeat: no-repeat; width: 170px; height: 40px; outline: none; cursor: pointer; }
  .upgrade-affordable { background-image: url("img/upgrade-affordable.png"); }
  .upgrade-affordable:hover { background-image: url("img/upgrade-hover.png"); }
  .upgrade-affordable:active { background-image: url("img/upgrade-click.png"); }
  .upgrade-too-expensive { background-image: url("img/upgrade-too-expensive.png"); cursor: not-allowed; }
</style>
</head>
<body>
  <a class="back" href="../../y2k.html">&lt;&lt; back to Evan's Handy Services</a>

  <div class="top-bg">
    <img class="banana-icon" src="img/banana.png" alt="bananas: ">
    <h1 class="banana-count-text" id="count">0</h1>
  </div>

  <div class="central-div">
    <p>click evan to pick bananas</p>
    <img id="evan" src="img/evan_head.png" alt="Evan" draggable="false">
    <br>
    <button class="plain" id="bunches">Bigger Bunches (cost: 10 bananas) +1 banana per click</button>
    <h1 id="per-click">Bananas per click: 1</h1>
    <div id="producers"></div>
  </div>

<script>
  let bananas = 0;
  let bananasPerClick = 1;

  const countEl = document.getElementById("count");
  const perClickEl = document.getElementById("per-click");

  function addBananas(amount) {
    bananas += amount;
    countEl.textContent = Math.round(bananas);
    producers.forEach(updateButton);
  }

  // click Evan
  document.getElementById("evan").addEventListener("click", (e) => {
    addBananas(bananasPerClick);
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.textContent = "+" + bananasPerClick + " 🍌";
    pop.style.left = e.clientX + "px";
    pop.style.top = e.clientY + "px";
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 800);
  });

  // Bigger Bunches: +1 banana per click for 10 bananas
  document.getElementById("bunches").addEventListener("click", () => {
    if (10 <= bananas) {
      addBananas(-10);
      bananasPerClick += 1;
      perClickEl.textContent = "Bananas per click: " + bananasPerClick;
    }
  });

  // producers: price grows 20% per purchase, value is bananas per second each
  const producers = [
    { name: "Banana Farm", price: 10, value: 5, icon: "img/banana-farm.jpg" },
    { name: "Banana Factory", price: 1000, value: 250, icon: "img/banana-factory.png" }
  ].map((p) => ({ ...p, quantity: 0 }));

  const list = document.getElementById("producers");
  producers.forEach((p) => {
    const div = document.createElement("div");
    div.className = "producer-main-div";
    div.innerHTML = `
      <div class="producer-left-side">
        <img class="producer-icon" src="${p.icon}" alt="',:)">
        <div class="producer-count-div">x <span class="qty">0</span></div>
      </div>
      <div class="producer-right-side">
        <h1 class="producer-name-text">${p.name}</h1>
        <div class="producer-purchase-div">
          <button class="upgrade upgrade-too-expensive"></button>
          <h1 class="producer-price-text"><span class="price">${p.price}</span> b</h1>
        </div>
      </div>`;
    list.appendChild(div);
    p.qtyEl = div.querySelector(".qty");
    p.priceEl = div.querySelector(".price");
    p.btn = div.querySelector("button");
    p.btn.addEventListener("click", () => {
      if (Math.floor(bananas) >= Math.floor(p.price)) {
        addBananas(-Math.floor(p.price));
        p.quantity += 1;
        p.price *= 1.2;
        p.qtyEl.textContent = p.quantity;
        p.priceEl.textContent = Math.floor(p.price);
        updateButton(p);
      }
    });
  });

  function updateButton(p) {
    const affordable = p.price <= bananas;
    p.btn.classList.toggle("upgrade-affordable", affordable);
    p.btn.classList.toggle("upgrade-too-expensive", !affordable);
  }

  // add bananas per second, 10 times a second
  setInterval(() => {
    const perSecond = producers.reduce((sum, p) => sum + p.quantity * p.value, 0);
    if (perSecond) addBananas(perSecond / 10);
  }, 100);
</script>
</body>
</html>
